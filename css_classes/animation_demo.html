<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Animation Demonstration</title>

  <style>
    /* ====== Page Layout ====== */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    header {
      margin-bottom: 2em;
    }

    h1 {
      color: #0d6efd;
      margin-bottom: 0.3em;
    }

    p {
      color: #555;
    }

    main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 3em;
      padding: 2em;
    }

    footer {
      margin-top: 2em;
      color: #666;
      font-size: 0.9em;
    }

    /* ====== Animated Elements ====== */
    /* Moving Box */
    .moving-box {
      width: 80px;
      height: 80px;
      background-color: #0d6efd;
      border-radius: 10px;
      animation: moveBox 3s ease-in-out infinite alternate;
    }

    @keyframes moveBox {
      0% { transform: translateX(0); background-color: #0d6efd; }
      50% { transform: translateX(150px); background-color: #6610f2; }
      100% { transform: translateX(0); background-color: #0dcaf0; }
    }

    /* Bouncing Ball */
    .bouncing-ball {
      width: 70px;
      height: 70px;
      background-color: #dc3545;
      border-radius: 50%;
      position: relative;
      animation: bounce 2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      animation-delay: 0.5s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-120px); }
    }

    /* Color-Changing Text */
    .color-text {
      font-size: 1.8em;
      font-weight: bold;
      animation: colorChange 4s linear infinite alternate;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    @keyframes colorChange {
      0% { color: #0d6efd; }
      25% { color: #20c997; }
      50% { color: #ffc107; }
      75% { color: #dc3545; }
      100% { color: #6610f2; }
    }

    /* ====== Responsiveness ====== */
    @media (max-width: 700px) {
      main {
        flex-direction: column;
        gap: 2em;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>CSS Animation Demonstration</h1>
    <p>Examples using <code>@keyframes</code>, delays, directions, and iterations.</p>
  </header>

  <main>
    <div class="moving-box"></div>
    <div class="bouncing-ball"></div>
    <div class="color-text">Color Changing Text</div>
  </main>

  <footer>
    © 2025 CSS Animation Demo | Created for CSS Exercises
  </footer>
</body>
</html>
