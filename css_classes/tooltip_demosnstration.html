<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Tooltip Demonstration</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2em;
    }

    h1 {
      margin: 0;
      color: #333;
    }

    p {
      color: #555;
    }
    .tooltip-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2em;
      flex-wrap: wrap;
    }

    .tooltip {
      position: relative;
      display: inline-block;
      cursor: pointer;
      font-size: 1.2em;
      color: #007bff;
      font-weight: 600;
    }

    .tooltip .tooltip-text {
      visibility: hidden;
      width: 140px;
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
      z-index: 10;
    }
    .tooltip .tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%; /* arrow points downward */
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #333 transparent transparent transparent;
    }
    .tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    footer {
      margin-top: 2em;
      text-align: center;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <header>
    <h1>Tooltip Demonstration Page</h1>
    <p>Hover over the icons or words below to see tooltips created using pure CSS.</p>
  </header>

  <main class="tooltip-container">
    <div class="tooltip">
      <span class="tooltip-text">This is a light bulb idea!</span>
    </div>

    <div class="tooltip">
      <span class="tooltip-text">Call us anytime!</span>
    </div>

    <div class="tooltip">Info
      <span class="tooltip-text">More details available here.</span>
    </div>

    <div class="tooltip">
      <span class="tooltip-text">You liked this!</span>
    </div>

    <div class="tooltip">Help
      <span class="tooltip-text">Need assistance? Click here.</span>
    </div>
  </main>

  <footer>
    © 2025 Tooltip Demo | Created for CSS Exercises
  </footer>
</body>
</html>
