<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="responsive-css-cheat-sheet.css">
</head>
<body>
  <main class="grid-container">
    <div class="box">
      <h2>Filters</h2>
      <p>Use CSS filters like <code>grayscale()</code>, <code>blur()</code>, <code>sepia()</code> for effects.</p>
    </div>
    <div class="box">
      <h2>Media Queries</h2>
      <p>Example: <code>@media (max-width: 600px) { ... }</code></p>
    </div>
    <div class="box">
      <h2>Responsive Design</h2>
      <p>Ensure layouts adapt to all screen sizes using Flexbox or Grid.</p>
    </div>
    <div class="box">
      <h2>Typography</h2>
      <p>Scale fonts using <code>clamp()</code> for responsive readability.</p>
    </div>
  </main>
</body>
</html>
