<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <main class="gallery">
    <figure>
      <img src="https://via.placeholder.com/300" alt="Blur">
      <figcaption>Blur</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300" alt="Grayscale">
      <figcaption>Grayscale</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300" alt="Sepia">
      <figcaption>Sepia</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300" alt="Brightness">
      <figcaption>Brightness</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300" alt="Contrast">
      <figcaption>Contrast</figcaption>
    </figure>
    <figure>
      <img src="https://via.placeholder.com/300" alt="Hue Rotate">
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </main>
</body>
</html>
