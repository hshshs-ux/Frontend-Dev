<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>
<body>
  <main class="card-container">
    <section class="profile-card">
      <img src="https://via.placeholder.com/200" alt="Profile 1">
      <h3>Profile 1</h3>
      <p>Designer</p>
    </section>
    <section class="profile-card">
      <img src="https://via.placeholder.com/200" alt="Profile 2">
      <h3>Profile 2</h3>
      <p>Developer</p>
    </section>
    <section class="profile-card">
      <img src="https://via.placeholder.com/200" alt="Profile 3">
      <h3>Profile 3</h3>
      <p>Manager</p>
    </section>
  </main>
</body>
</html>
