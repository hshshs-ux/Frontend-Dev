<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design Principles Summary</title>
  <link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>
  <main class="grid-container">
    <div class="box">
      <h2>Fluid Layouts</h2>
      <p>Use percentages for width to make elements flexible.</p>
      <code>width: 80%;</code>
    </div>
    <div class="box">
      <h2>Flexible Media</h2>
      <p>Make images scale with max-width: 100%.</p>
      <code>img { max-width: 100%; }</code>
    </div>
    <div class="box">
      <h2>Breakpoints</h2>
      <p>Use media queries for layout adjustments.</p>
      <code>@media (max-width: 600px) { ... }</code>
    </div>
  </main>
</body>
</html>
